<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Present · SurveyAll</title>
<!-- Tab icon. The SVG is what modern browsers use; the PNGs are for
     Safari's older raster paths and for a phone home screen. Paths are
     root-relative so they resolve the same from /join and /create as
     they do from /. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/Inter-Variable.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/Fraunces-Variable.woff2">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/present.css">
<link rel="stylesheet" href="styles/ambience.css">
<link rel="stylesheet" href="styles/elements.css">
</head>
<body class="present-body">

<div class="stage" id="stage">
  <div class="stage-backdrop" id="backdrop"></div>
  <div class="stage-scrim" id="scrim"></div>

  <!-- placed elements ---------------------------------------------- -->
  <!-- A direct child of .stage, which the overlay-lift list above it in
       present.css deliberately does not name — the same arrangement as
       the backdrop, the scrim, the join corner, the Q&A drawer and the
       flash. All of those set their own position and z-index and stay
       out of the flex column; this one does too, at z-index 3, which is
       above the slide's content (2) and below the join card (6) and the
       controls (7). That ordering is the guarantee: a mark can point at
       a bar, and nothing an instructor places can ever cover the QR the
       room is trying to scan. See app/elements.js. -->
  <!-- Behind the slide's content (z-index 1, after the scrim in DOM so it
       paints above it) — for watermarks and scene-setting. -->
  <div class="decor-layer decor-layer-back" id="decorBack" hidden></div>

  <!-- lobby ------------------------------------------------------- -->
  <div class="lobby" id="lobby" hidden>
    <p class="stage-kicker" id="lobbyKicker">SurveyAll</p>
    <h1 class="lobby-title" id="lobbyTitle">Loading…</h1>
    <p class="lobby-sub">Scan the code, or go to the address below.</p>

    <div class="join-corner is-big" id="lobbyJoin">
      <div class="join-qr" id="lobbyQR"></div>
      <div class="join-meta">
        <span class="join-label">Go to</span>
        <span class="join-url" id="lobbyURL">—</span>
        <span class="join-label">Code</span>
        <span class="join-code" id="lobbyCode">——————</span>
      </div>
    </div>

    <!-- Live headcount: how many phones are connected right now, so the
         presenter knows the room is in before starting. Fed by the Durable
         Object's own socket set (see subscribeToPresence), hidden until the
         first count arrives so it never flashes a stale "0". -->
    <p class="lobby-presence" id="lobbyPresence" role="status" aria-live="polite" hidden>
      <span class="presence-dot" aria-hidden="true"></span>
      <span id="lobbyPresenceText">Waiting for the room…</span>
    </p>

    <!-- No privacy paragraph here. This is projected in front of the whole
         room at the start of every session, and a promise that nothing can
         be traced reads to a class as permission rather than as reassurance.
         The app is still anonymous by design (see the FERPA note in
         worker/schema.sql); the instructor makes that case in their own
         words, and docs/DEPLOYMENT.md states it for a department. -->
  </div>

  <!-- live question ----------------------------------------------- -->
  <div class="stage-head" id="head" hidden>
    <div class="stage-heading">
      <p class="stage-kicker" id="kicker">Question 1</p>
      <h1 class="stage-prompt" id="prompt"></h1>
    </div>
    <div id="timerHost"></div>
  </div>

  <div class="stage-body" id="body" hidden>
    <div class="chart" id="chart"></div>
  </div>

  <div class="stage-foot" id="foot" hidden>
    <span class="count-pill" id="countPill">
      <span class="dot-live" aria-hidden="true"></span>
      <span id="countText">0 responses</span>
    </span>
    <!-- volunteer pool: how many would say more aloud — a count, never names -->
    <span class="count-pill hands-pill" id="handsPill" hidden>🖐 <span id="handsText">0</span></span>
    <!-- pace channel: "lost me" flares from the last two minutes — a count,
         never names. It cools on its own; a spike that ended is over. -->
    <span class="count-pill pace-pill" id="pacePill" hidden>⚑ <span id="paceText">0</span></span>
    <span class="muted" id="stateNote"></span>
    <span class="spacer"></span>
    <div class="progress-dots" id="dots"></div>
    <!-- Screen-reader narration of the room: question changes, voting
         state, the reveal, and a rate-limited response count. Inside the
         footer on purpose — .stage-foot is already in the overlay-lift
         list, so no new direct child of .stage is introduced. -->
    <div class="sr-only" role="status" aria-live="polite" id="srStatus"></div>
  </div>

  <!-- always-available join corner (proposal P4) -------------------- -->
  <div class="join-corner" id="joinCorner" hidden>
    <div class="join-qr" id="cornerQR"></div>
    <div class="join-meta">
      <span class="join-label">Join anytime</span>
      <span class="join-url" id="cornerURL">—</span>
      <span class="join-code" id="cornerCode">——————</span>
    </div>
  </div>

  <!-- Q&A panel ---------------------------------------------------- -->
  <aside class="stage-panel" id="qaPanel" aria-label="Audience questions">
    <div class="panel-head">
      <span class="panel-title">Questions from the room</span>
      <span class="spacer"></span>
      <button class="btn btn-sm btn-ghost" id="qaClose" type="button">Close</button>
    </div>
    <div class="panel-body" id="qaBody"></div>
  </aside>

  <!-- In front of the slide's content (z-index 3) — for marks that point
       at something. Still below the join card (6) and the controls (7),
       which is what keeps the QR uncoverable. -->
  <div class="decor-layer decor-layer-front" id="decorFront" hidden></div>

  <div class="stage-flash" id="flash" aria-hidden="true"></div>

  <!-- control bar -------------------------------------------------- -->
  <!-- Only Previous and Next stay on screen. Everything else lives behind
       the ⋯ button, because this bar is projected in front of a class and
       a row of teaching controls competing with the question is noise. -->
  <div class="stage-controls" id="controls">
    <button class="ctrl" id="btnPrev" type="button" title="Previous (←)">←</button>
    <button class="ctrl" id="btnNext" type="button" title="Next (→)">→</button>
    <button class="ctrl ctrl-toggle" id="btnMore" type="button"
            aria-expanded="false" aria-controls="ctrlMore"
            title="More controls">⋯</button>

    <!-- Each shortcut is printed on the button it triggers. There used to
         be a separate keyboard crib bar above this one listing the same
         eight shortcuts a second time. -->
    <div class="ctrl-more" id="ctrlMore">
      <span class="ctrl-sep"></span>
      <button class="ctrl" id="btnHide" type="button" title="Hide/show results">
        <span class="ctrl-label">Hide</span><kbd>H</kbd></button>
      <button class="ctrl" id="btnClose" type="button" title="Close/open voting">
        <span class="ctrl-label">Close voting</span><kbd>C</kbd></button>
      <button class="ctrl" id="btnTimer" type="button" title="Timer, or press 1-9 for that many ×10 seconds">
        <span class="ctrl-label">Timer</span><kbd>T</kbd></button>
      <span class="ctrl-sep"></span>
      <button class="ctrl" id="btnDiscuss" type="button"
              title="Peer instruction: close, discuss, vote again, reveal the change">
        <span class="ctrl-label">Discuss</span><kbd>P</kbd></button>
      <!-- Mazur's decision band, computed from round one. Lives in this
           transient tray rather than on the open slide. -->
      <span class="pi-hint" id="piHint" hidden></span>
      <button class="ctrl" id="btnReask" type="button" title="Ask again, keeping the first round">
        <span class="ctrl-label">Re-ask</span><kbd>R</kbd></button>
      <button class="ctrl" id="btnDelta" type="button" title="Compare rounds">
        <span class="ctrl-label">Compare</span><kbd>D</kbd></button>
      <!-- Reading aids. Both are about the moment AFTER the vote, when the
           chart stops being a scoreboard and becomes the thing the room
           argues about: sort so the ranking is a shape rather than a
           calculation, list so the cloud's areas become comparable
           lengths. Tapping a bar to point at it needs no button. -->
      <button class="ctrl" id="btnSort" type="button"
              title="Sort the bars by size (once voting is closed)">
        <span class="ctrl-label">Sort</span><kbd>S</kbd></button>
      <button class="ctrl" id="btnCloudList" type="button" hidden
              title="Show the word cloud as a ranked list">
        <span class="ctrl-label">Ranked list</span><kbd>W</kbd></button>
      <button class="ctrl" id="btnBoard" type="button" title="Leaderboard">
        <span class="ctrl-label">Leaderboard</span><kbd>L</kbd></button>
      <span class="ctrl-sep"></span>
      <button class="ctrl" id="btnShare" type="button" title="Show results on phones">
        <span class="ctrl-label">Push to phones</span></button>
      <button class="ctrl" id="btnQA" type="button" title="Questions from the room"
              aria-expanded="false" aria-controls="qaPanel">
        <span class="ctrl-label">Q&amp;A</span><kbd>Q</kbd></button>
      <button class="ctrl" id="btnFull" type="button" title="Fullscreen">
        <span class="ctrl-label">Fullscreen</span><kbd>F</kbd></button>
      <span class="ctrl-sep"></span>
      <button class="ctrl" id="btnEnd" type="button" title="End session">
        <span class="ctrl-label">End</span></button>
    </div>
  </div>
</div>

<script type="module" src="app/present-page.js"></script>
</body>
</html>
