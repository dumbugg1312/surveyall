<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks · SurveyAll</title>
<!-- Tab icon. The SVG is what modern browsers use; the PNGs are for
     Safari's older raster paths and for a phone home screen. Paths are
     root-relative so they resolve the same from /join and /create as
     they do from /. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<!-- Deck cards show a real slide, and a slide is the projector scaled
     down — see app/slide-preview.js. -->
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/present.css">
<link rel="stylesheet" href="styles/elements.css">
<link rel="stylesheet" href="styles/ambience.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<header class="appbar">
  <a class="brand" href="dashboard.html">SurveyAll</a>
  <span class="spacer"></span>
  <!-- The account button. There is no account PAGE in this app and does
       not need to be: a username, a password and nothing else fits in a
       dialog. Before this, changePassword() existed in db.js with no way
       to reach it — the only route to a new password was asking an
       admin. -->
  <button class="btn btn-sm btn-ghost" id="who" type="button"
          aria-label="Your account"></button>
  <!-- Admin only — shown by app/dashboard-page.js once the account is known. -->
  <a class="btn btn-sm btn-ghost" id="adminLink" href="admin.html" hidden>Admin</a>
  <button class="btn btn-sm btn-ghost" id="signOut" type="button">Sign out</button>
</header>

<main class="page">

  <!-- A session that is live outranks everything else on this page: you
       are standing in front of the room. Renders nothing otherwise. -->
  <div id="liveArea" hidden></div>

  <section class="dash-section" aria-labelledby="decksHead">
    <div class="section-head">
      <h2 id="decksHead">Your decks</h2>
      <span class="head-count" id="deckCount" hidden></span>
      <span class="spacer"></span>
      <button class="btn" id="importDeck" type="button">Import from text</button>
      <button class="btn btn-primary" id="newDeck" type="button">New deck</button>
    </div>
    <div id="deckArea"></div>
  </section>

  <section class="dash-section" aria-labelledby="archiveHead">
    <div class="section-head">
      <h2 id="archiveHead">Session archive</h2>
      <span class="head-count" id="sessionCount" hidden></span>
    </div>

    <!-- The archive is the point of keeping sessions forever, so it gets
         the tools a growing pile needs: find one, narrow to a deck, and
         separate the class you actually taught from the session nobody
         joined. Hidden until there is enough here to need it. -->
    <div class="archive-bar" id="archiveBar" hidden>
      <div class="archive-search">
        <label class="sr-only" for="sessionSearch">Search sessions</label>
        <input type="search" id="sessionSearch" placeholder="Search label, code, or deck"
               autocomplete="off" spellcheck="false">
      </div>
      <label class="sr-only" for="deckFilter">Filter by deck</label>
      <select id="deckFilter">
        <option value="">All decks</option>
      </select>
      <div class="seg" id="yieldFilter" role="group" aria-label="Filter by responses">
        <button type="button" class="seg-btn is-on" data-yield="all" aria-pressed="true">All</button>
        <button type="button" class="seg-btn" data-yield="answered" aria-pressed="false">With answers</button>
        <button type="button" class="seg-btn" data-yield="empty" aria-pressed="false">Empty</button>
      </div>
    </div>

    <div id="sessionArea"></div>
  </section>

  <!-- One line, not three. The full version is a page, and it is linked;
       three sentences of body text below the archive was a paragraph
       nobody read occupying the end of the most-used screen in the app. -->
  <p class="privacy-note">
    Sessions store answers only — no names, emails, IDs or IP addresses.
    <a href="privacy.html">What's stored, and who can see it</a>.
  </p>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" id="srStatus" role="status" aria-live="polite"></p>

<script type="module" src="app/dashboard-page.js"></script>
<script type="module" src="app/feedback.js"></script>
</body>
</html>
