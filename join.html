<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="robots" content="noindex">
<!-- No analytics, no trackers, no third-party scripts. See docs/architecture.md §5. -->
<title>Join · SurveyAll</title>
<!-- Tab icon. The SVG is what modern browsers use; the PNGs are for
     Safari's older raster paths and for a phone home screen. Paths are
     root-relative so they resolve the same from /join and /create as
     they do from /. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/join.css">
</head>
<body class="join-body">

  <!-- The one thing on this page that talks to a screen reader by itself.
       <main> used to carry aria-live, which meant every repaint re-read the
       whole screen — prompt, hint, every option, the button — and, once the
       presenter pushed results, re-read the chart every four seconds with no
       way for the student to stop it. Announcements are now deliberate: the
       controller writes a single short sentence here when something has
       actually changed underneath the student (voting closed, a new
       question, the connection dropped). -->
  <p id="join-status" class="sr-only" role="status" aria-live="polite"></p>

  <main class="join-shell" id="app">
    <!-- The ship state needs the same <h1> every screen built by
         showState() gets: this is the page until the first fetch lands,
         and on a slow phone it is on screen for several seconds. -->
    <div class="join-state">
      <div class="pulse-wait" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 class="state-title">Connecting…</h1>
      <p class="state-text">Finding the session.</p>
    </div>
  </main>

  <!-- Deliberately no "your answers cannot be traced back to you" footer.
       The app IS anonymous by design (see worker/schema.sql), but telling a
       room of students that on the answer screen reads as an invitation to
       misbehave rather than as a privacy assurance. The instructor explains
       the privacy model to the class; the answer box does not advertise it.
       The placeholder text still says "no need to include your name", which
       is the part a student actually needs at the moment of typing. -->

  <script type="module" src="app/join-page.js"></script>
</body>
</html>
