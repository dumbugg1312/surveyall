<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="robots" content="noindex">
<!-- No analytics, no trackers, no third-party scripts. See docs/architecture.md §5. -->
<title>Join — SurveyAll</title>
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/join.css">
</head>
<body class="join-body">

  <main class="join-shell" id="app" aria-live="polite">
    <div class="join-state">
      <div class="pulse-wait" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="state-text">Connecting…</p>
    </div>
  </main>

  <!-- Deliberately no "your answers cannot be traced back to you" footer.
       The app IS anonymous by design (see worker/schema.sql), but telling a
       room of students that on the answer screen reads as an invitation to
       misbehave rather than as a privacy assurance. The instructor explains
       the privacy model to the class; the answer box does not advertise it.
       The placeholder text still says "no need to include your name", which
       is the part a student actually needs at the moment of typing. -->

  <script type="module" src="app/join-page.js"></script>
</body>
</html>
