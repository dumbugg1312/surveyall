<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — SurveyAll</title>
<!-- Tab icon. The SVG is what modern browsers use; the PNGs are for
     Safari's older raster paths and for a phone home screen. Paths are
     root-relative so they resolve the same from /join and /create as
     they do from /. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/charts.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<header class="appbar">
  <a class="brand" href="dashboard.html">SurveyAll</a>
  <span class="muted" id="crumb" style="font-size:.85rem"></span>
  <span class="spacer"></span>
  <button class="btn btn-sm" id="downloadCSV" type="button">Download CSV</button>
</header>

<main class="page">
  <div id="summary"></div>
  <div class="stack" id="blocks">
    <p class="muted">Loading…</p>
  </div>

  <p class="privacy-note">
    The <strong>respondent</strong> column in the CSV holds a random nickname that was
    assigned for this session only. It is not a name, an ID, or a device identifier,
    and it cannot be matched to the same person in any other session — there is
    nothing in this export to redact before you share it.
  </p>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="app/results-page.js"></script>
<script type="module" src="app/feedback.js"></script>
</body>
</html>
